name: Continuous new Account journey QA (synthetic only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'software/inventory/**'
      - 'account/**'
      - 'qa/account-journey*'
      - '.github/workflows/account-journey.yml'
permissions:
  contents: read
jobs:
  synthetic-browser:
    # Pin the supported OS alongside the browser version; latest may advance first.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check stateful fake Core contract
        run: node --test qa/account-journey-fixture.test.mjs
      - name: Install official Playwright browser
        run: |
          npm install --prefix .qa-tools --no-save --ignore-scripts playwright@1.56.1
          .qa-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Run localhost-only synthetic states at 390px emulated width
        run: node qa/account-journey-ci.mjs
      - name: Retain synthetic screenshots and DOM metrics (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-journey-${{ github.sha }}
          path: qa-artifacts/account-journey/
          retention-days: 7
          if-no-files-found: warn
