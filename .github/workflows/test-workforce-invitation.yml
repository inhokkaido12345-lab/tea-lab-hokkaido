# 画面の招待リトライ・偽装応答拒否を検証する。実アカウントは使用しない。
name: Test Workforce Invitation UI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/sync-worktime-url.py --check
      - run: node --test tests/*.mjs
      # Existing runner Chrome only; synthetic file:// page, no external service/auth.
      - run: |
          set -o pipefail
          node scripts/measure-saved-shift-browser.mjs | tee saved-shift-browser.json
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-saved-shift-browser-timings
          path: saved-shift-browser.json
