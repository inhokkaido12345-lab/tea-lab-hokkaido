name: Check Inventory PWA live files
on:
  push:
    branches: [main]
    paths:
      - 'workforce/inventory/**'
      - '.github/workflows/check-inventory-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the published files without login or inventory updates
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const names=['index.html','app.js','employee-transport.js','config.js','manifest.webmanifest','style.css'];
          const normalize=text=>text.replace(/\r\n/g,'\n').trimEnd();
          let ready=false;
          for(let attempt=0;attempt<10;attempt++){
            const results=await Promise.all(names.map(async name=>{
              try{
                const response=await fetch('https://tealabhokkaido.com/workforce/inventory/'+name+'?v='+process.env.GITHUB_SHA,
                  {cache:'no-store',signal:AbortSignal.timeout(15000)});
                return response.ok&&normalize(await response.text())===normalize(readFileSync('workforce/inventory/'+name,'utf8'));
              }catch{return false;}
            }));
            if(results.every(Boolean)){ready=true;break;}
            if(attempt<9)await new Promise(resolve=>setTimeout(resolve,8000));
          }
          if(!ready)throw Error('INVENTORY_LIVE_FILES_NOT_CONFIRMED');
          console.log('INVENTORY_LIVE_FILES_CONFIRMED 6');
          NODE
