name: Check Inventory PWA live files
on:
  push:
    branches: [main]
    paths:
      - 'Software/inventory/**'
      - 'inventory/**'
      - 'workforce/inventory/**'
      - '.github/workflows/check-inventory-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the published files without login or inventory updates
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const names=["Software/inventory/index.html","Software/inventory/app.js","Software/inventory/employee-login.js","Software/inventory/employee-transport.js","Software/inventory/style.css","Software/inventory/config.js","Software/inventory/manifest.webmanifest","workforce/inventory/auth/index.html","workforce/inventory/auth/auth.js","workforce/inventory/index.html","inventory/index.html"];
          const normalize=text=>text.replace(/\r\n/g,'\n').trimEnd();
          let ready=false;
          for(let attempt=0;attempt<15;attempt++){
            const results=await Promise.all(names.map(async name=>{
              try{
                const response=await fetch('https://tealabhokkaido.com/'+name+'?v='+process.env.GITHUB_SHA,
                  {cache:'no-store',signal:AbortSignal.timeout(15000)});
                return response.ok&&normalize(await response.text())===normalize(readFileSync(name,'utf8'));
              }catch{return false;}
            }));
            if(results.every(Boolean)){ready=true;break;}
            if(attempt<14)await new Promise(resolve=>setTimeout(resolve,8000));
          }
          if(!ready)throw Error('INVENTORY_LIVE_FILES_NOT_CONFIRMED');
          console.log('INVENTORY_LIVE_FILES_CONFIRMED 11');
          NODE
