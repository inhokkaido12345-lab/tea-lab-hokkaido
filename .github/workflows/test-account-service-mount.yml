name: Account service category integration QA
on:
  pull_request:
    paths: ['account/**', 'qa/account-service-mount-ci.mjs', '.github/workflows/test-account-service-mount.yml']
permissions:
  contents: read
jobs:
  synthetic-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install official Playwright
        run: npm install --prefix .qa-tools --no-save --package-lock=false playwright@1.56.1 && .qa-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Exercise closed candidate UI
        run: node qa/account-service-mount-ci.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-service-mount-${{ github.sha }}
          path: qa-artifacts/account-service-mount/
          retention-days: 7
