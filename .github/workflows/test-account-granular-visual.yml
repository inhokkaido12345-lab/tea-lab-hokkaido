name: Account granular permissions visual QA
on:
  pull_request:
    paths: ['account/**', 'qa/account-granular-permissions-ci.mjs', '.github/workflows/test-account-granular-visual.yml']
permissions:
  contents: read
jobs:
  synthetic-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix .qa-tools --no-save --package-lock=false playwright@1.56.1 && .qa-tools/node_modules/.bin/playwright install --with-deps chromium
      - run: node qa/account-granular-permissions-ci.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-granular-${{ github.sha }}
          path: qa-artifacts/account-granular/
          retention-days: 7
