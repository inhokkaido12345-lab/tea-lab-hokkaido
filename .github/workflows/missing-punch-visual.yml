name: Missing-punch synthetic visual QA (no live services)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'workforce/**'
      - 'software/worktime/**'
      - 'qa/missing-punch-visual-ci.mjs'
      - 'tests/missing-punch*'
      - '.github/workflows/missing-punch-visual.yml'
permissions:
  contents: read
jobs:
  synthetic-browser:
    # Pin the supported OS alongside the browser version; latest may advance first.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check synthetic contract fixtures
        run: node --test tests/*.mjs
      - name: Install official Playwright browser
        run: |
          npm install --prefix .qa-tools --no-save --ignore-scripts playwright@1.56.1
          .qa-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Run localhost-only synthetic states at mobile and desktop widths
        run: node qa/missing-punch-visual-ci.mjs
      - name: Retain synthetic screenshots and DOM metrics (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: missing-punch-synthetic-visual-${{ github.sha }}
          path: qa-artifacts/missing-punch/
          retention-days: 7
          if-no-files-found: warn
