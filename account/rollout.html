<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>TLH 共通所属の初期導入</title><link rel="stylesheet" href="/workforce/fonts/ibm-plex-sans-jp.css"><link rel="stylesheet" href="account.css"><script src="/software/inventory/employee-login.js" defer></script><script src="/workforce/account-info.js" defer></script><script src="rollout.js" defer data-bootstrap="true"></script></head><body><header><a href="./">TLH Accountへ戻る</a><h1>共通所属の初期導入・停止</h1><p><a href="inventory-freeze.html">移行凍結を確認（在庫変更なし）</a></p><p>TLH運営管理者と対象会社の管理者を兼ねる方の専用操作です。</p></header><main>
<section><button id="rollout-login" type="button">LINEで本人確認</button><p id="rollout-status" role="status" aria-live="polite">操作はまだ行われていません。</p>
<form id="rollout-form"><fieldset id="rollout-fields" disabled><legend>変更する対象と操作</legend><label>操作<select id="rollout-command"><option value="INITIAL_INVENTORY_MIGRATION">初期準備：明示した所属・権限を保存（LEGACYのまま）</option><option value="ACTIVATE_COMMON">COMMONを有効化（在庫の実行設定は別途）</option><option value="SUSPEND_COMMON">COMMONを停止（LEGACYへ戻さない）</option></select></label>
<label>会社ID<input id="rollout-organizationId" required maxlength="128" autocomplete="off"></label><label>店舗ID<input id="rollout-storeId" required maxlength="128" autocomplete="off"></label><label>在庫serviceInstanceId<input id="rollout-serviceInstanceId" required maxlength="80" autocomplete="off"></label><label>在庫localStoreId<input id="rollout-localStoreId" required maxlength="80" autocomplete="off"></label>
<div id="rollout-source"><label>sourceVersion<input id="rollout-sourceVersion" maxlength="128" autocomplete="off"></label><label>sourceDigest（SHA-256）<input id="rollout-sourceDigest" maxlength="64" autocomplete="off" spellcheck="false"></label></div>
<div id="rollout-migration"><label>bindingStatus<select id="rollout-bindingStatus"><option value="INACTIVE">INACTIVE</option><option value="ACTIVE">ACTIVE</option></select></label><label>entitlementStatus<select id="rollout-entitlementStatus"><option value="INACTIVE">INACTIVE</option><option value="ACTIVE">ACTIVE</option></select></label><label>members JSON（accountId / permissions / validFromDate / validToDate）<textarea id="rollout-members" rows="8" autocomplete="off" spellcheck="false"></textarea></label><p>社員・OWNERから自動変換しません。権限は inventory.read / receive / order / manage を完全名で明示します。</p></div>
<div id="rollout-activation" hidden><label>freezeId（32桁）<input id="rollout-freezeId" maxlength="32" autocomplete="off" spellcheck="false"></label><p>配布済み在庫がfreezeを実際に守ることを別途確認してください。マーカーだけでは凍結を保証できません。</p></div>
<label>変更理由<input id="rollout-reason" required maxlength="200" autocomplete="off"></label></fieldset><button id="rollout-preview-button" type="submit" disabled>変更内容と現在の権限を確認</button></form>
<div id="rollout-preview" hidden><h2>保存前の確認</h2><p id="rollout-warning"></p><pre id="rollout-summary" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre><label><input id="rollout-consent" type="checkbox">対象・全員の権限・変更内容と検証の限界を確認しました</label><button id="rollout-commit" type="button" disabled>この内容で確定する</button></div><button id="rollout-retry" type="button" hidden>同じ操作の結果を確認</button><button id="rollout-cancel" type="button" hidden>確認をやめる</button><p>保存結果が不明な間は別操作を始めないでください。画面を閉じても保存は取り消されません。</p><iframe id="rollout-frame" name="tlhCommonRolloutFrame" title="初期導入操作の応答" hidden></iframe></section></main></body></html>
