<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>シフト表の表示見本（架空）</title>
<link rel="stylesheet" href="../workforce/fonts/ibm-plex-sans-jp.css"><link rel="stylesheet" href="../workforce/app.css"><link rel="stylesheet" href="../workforce/schedule.css">
<body class="secondary-page schedule-page"><main><h1>シフト表の表示見本</h1><p>架空の従業員・予定です。保存・認証・実データへの通信はありません。</p><div id="demo-matrix" class="schedule-matrix-calendar"></div>
<button id="schedule-png" disabled>PNG保存（架空データ）</button><button id="schedule-print" hidden>印刷</button><button id="schedule-csv" hidden>CSV</button><p id="schedule-export-status" hidden></p>
<section id="schedule-report" class="schedule-print-only" hidden><h1 id="schedule-report-title"></h1><p id="schedule-report-meta"></p><p>時刻は日本時間。休は予定休憩。勤務日数は各表の期間内の勤務予定日数です。公休・予定未設定・未公開は別です。</p><div id="schedule-report-rows"></div></section></main>
<script src="../workforce/schedule-view.js"></script><script src="../workforce/schedule-report.js"></script><script>
const s={month:'2026-11',period:'MONTH',phase:'PUBLISHED',publishedAt:'2026-11-10T03:00:00Z',plans:[],events:[{day:'2026-11-03',title:'文化の日',note:''},{day:'2026-11-23',title:'勤労感謝の日',note:''}]};
for(let e=0;e<7;e++)for(let d=1;d<=30;d++){
 const day='2026-11-'+String(d).padStart(2,'0'),off=(d+e)%4===0,start=e%2?12:9,end=e%2?21:18;
 s.plans.push({employeeCode:'DEMO_'+String(e+1).padStart(3,'0'),employeeName:'架空従業員'+String.fromCharCode(65+e),day,periods:off?[]:[{start:String(start).padStart(2,'0')+':00',end:String(end).padStart(2,'0')+':00',endNextDay:false,breakMinutes:60}],workIntervals:off?[]:[{startAtUtc:new Date(day+'T'+String(start).padStart(2,'0')+':00:00+09:00').toISOString(),endAtUtc:new Date(day+'T'+end+':00:00+09:00').toISOString()}],plannedMinutes:off?0:480,leaveType:off?'PUBLIC_OFF':'NONE',publicNote:d===11&&e===2?'会議13〜':d===18&&e===3?'出張':''});
}
TlhScheduleReport.renderMatrix(document.getElementById('demo-matrix'),TlhScheduleView.matrix(s),'DEMO_001');
const report=TlhScheduleReport.init();report.setShared(s);
// ?print=1 は印刷CSSの画面見本。実PDFの保存操作はせず、同じ表/寸法で確認する。
if(new URLSearchParams(location.search).has('print')){for(const sheet of document.styleSheets)for(const rule of sheet.cssRules)if(rule.media&&rule.conditionText==='print')rule.media.mediaText='all';dispatchEvent(new Event('beforeprint'));}
</script></body></html>
