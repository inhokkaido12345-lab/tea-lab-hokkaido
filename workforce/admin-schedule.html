<!doctype html>
<!-- 管理の正本UI。勤務/メモ/用事の編集はシートだけ。CSVやセル編集のフォームを置かない。
     削除影響: 管理入口だけ停止。申請/打刻の原簿は保持。公開のREAD/確認/固定IDはcontrollerへ。
     魔改造: 元HTML→sync-schedule-workspace.pyでホームへ合成。生成領域を直接編集しない。 -->
<html lang="ja"><head><meta charset="utf-8">
<script src="/workforce/worktime-url.js"></script><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>シフトの管理 | TLH Work Time</title>
<link rel="stylesheet" href="fonts/ibm-plex-sans-jp.css?v=1"><link rel="stylesheet" href="app.css?v=20261110-hierarchy1"><link rel="stylesheet" href="schedule.css?v=20261110-management1">
<script defer src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script defer src="current-workplace.js?v=20261105-store2"></script><script defer src="auto-read.js?v=20261110-management1"></script><script defer src="schedule-view.js?v=20261104-periods"></script><script defer src="schedule-report.js?v=20261110-month-view1"></script><script defer src="schedule.js?v=20261110-month-view1"></script><script defer src="schedule-management-contract.js?v=20261110-management1"></script><script defer src="schedule-management.js?v=20261110-month-view1" data-bootstrap="true"></script>
</head><body class="secondary-page schedule-page"><header><strong>TLH Work Time</strong><a class="button secondary" href="index.html#manager-schedule">シフトの管理へ戻る</a></header>
<aside class="current-workplace-mark" data-current-workplace aria-label="このタイムカードの店舗"><strong>The TEA ココノススキノ店</strong><span>オールレンタカー株式会社</span></aside>
<main><h1>シフトの管理</h1>
<div id="schedule-management-root">
<div class="filters"><label>管理する月<input id="schedule-management-month" type="month" disabled></label></div>
<div class="schedule-management-tabs" role="tablist" aria-label="シフト管理の作業"><button id="schedule-management-edit-tab" type="button" role="tab" aria-selected="true" aria-controls="schedule-management-edit-panel">シフト編集・公開</button><button id="schedule-management-requests-tab" type="button" role="tab" aria-selected="false" aria-controls="schedule-management-requests-panel">希望休</button></div>

<p id="schedule-management-status" role="status" aria-live="polite" aria-busy="false">管理者の本人確認を待っています。</p><button id="schedule-management-login" type="button" hidden>LINEログイン</button><button id="schedule-management-refresh" type="button" hidden>再読み込み</button>
<section id="schedule-management-edit-panel" role="tabpanel" aria-labelledby="schedule-management-edit-tab">
<div class="schedule-sheet-actions"><button id="schedule-management-sheet-create" type="button" disabled>該当月の入力シートを作成</button><a id="schedule-management-sheet-open" class="button secondary" href="#" target="_blank" rel="noopener" hidden>入力シートを開く</a></div>
<section class="management-section"><h2>下書き公開</h2><label>公開・変更反映する日付<select id="schedule-management-period" disabled><option value="FIRST">1〜15日</option><option value="SECOND">16日〜月末</option></select></label><p id="schedule-management-phase" class="footnote"></p><p class="footnote">シートで編集後、この操作で変更を読み込み、確認して選択期間を公開します。公開済み勤務の変更は本人同意・承認を経て反映します。</p><button id="schedule-management-publish" type="button" disabled>下書きを公開する</button></section>
</section>
<section id="schedule-management-requests-panel" role="tabpanel" aria-labelledby="schedule-management-requests-tab" hidden>
<section class="management-section"><h2>希望受付の設定</h2><p class="footnote">締切未設定でも希望を申請できます。設定後はその締切に従います。この月の申請をまとめて確認し、各日付の締切を設定してください。</p><label>1〜15日の希望締切（日本時間）<input id="schedule-management-deadline" type="datetime-local" disabled></label><button id="schedule-management-deadline-save" type="button" disabled>1〜15日の締切を設定</button><label>16日〜月末の希望締切（日本時間）<input id="schedule-management-deadline-second" type="datetime-local" disabled></label><button id="schedule-management-deadline-save-second" type="button" disabled>16日〜月末の締切を設定</button></section>
<section class="management-section"><h2>希望休承認</h2><div id="schedule-management-requests"></div></section>
</section>
<section id="schedule-management-confirm" class="session-notice" role="region" aria-labelledby="schedule-management-question" hidden><h2 id="schedule-management-question"></h2><label id="schedule-management-reason-label" hidden>公開済み勤務の変更理由<textarea id="schedule-management-reason" rows="2" maxlength="500" disabled></textarea></label><button id="schedule-management-approve" type="button">確認した内容を実行する</button><button id="schedule-management-cancel" type="button">やめる</button></section>
<button id="schedule-management-retry" type="button" hidden disabled>同じ操作で結果を再確認</button>
<iframe id="schedule-management-frame" name="tlhScheduleManagementFrame" title="管理シフトの署名付き応答" hidden></iframe>
</div>
</main></body></html>
