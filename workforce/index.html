<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>TLH 勤怠管理</title>

  <!--
    LINE公式のLIFF SDK。
    このページ自体はGitHub Pagesから通常のtop-level HTTPSページとして配信する。
    GAS HtmlServiceのiframe sandboxを避けるのが今回の重要な設計変更。
  -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: light dark;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: max(24px, env(safe-area-inset-top))
               max(20px, env(safe-area-inset-right))
               max(24px, env(safe-area-inset-bottom))
               max(20px, env(safe-area-inset-left));
      line-height: 1.6;
    }

    main {
      width: min(100%, 560px);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.45rem;
    }

    .subtitle {
      margin: 0;
      opacity: 0.68;
      font-size: 0.9rem;
    }

    .card {
      margin-top: 20px;
      padding: 18px;
      border: 1px solid currentColor;
      border-radius: 14px;
    }

    .status-title {
      font-weight: 700;
    }

    .detail {
      margin-top: 8px;
      opacity: 0.78;
      font-size: 0.92rem;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .steps {
      margin: 14px 0 0;
      padding-left: 1.25rem;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .error {
      opacity: 1;
    }
  </style>
</head>
<body>
  <main>
    <h1>TLH 勤怠管理</h1>
    <p class="subtitle">LINE MINI App 接続テスト</p>

    <section class="card" aria-live="polite">
      <div id="status-title" class="status-title">GitHub Pagesを読み込みました</div>
      <div id="status-detail" class="detail">LIFFを初期化しています。</div>

      <ol class="steps">
        <li>GitHub Pages</li>
        <li>LIFF初期化</li>
      </ol>
    </section>
  </main>

  <script>
    /**
     * LINE MINI App の本番用 LIFF ID。
     *
     * LIFF IDは秘密情報ではない。
     * 実際のLIFF URL自体にも含まれる公開識別子なので、
     * smoke testではGASから毎回取得せず、この静的frontendへ直接置く。
     *
     * これにより:
     * GitHub Pages -> GAS publicConfig -> LIFF
     *
     * という余計な依存をなくし、
     * GitHub Pages -> LIFF
     *
     * の最小経路だけを検証できる。
     *
     * Channel Secret / access token / ID token等の秘密値は
     * 絶対にこのHTMLへ置かない。
     */
    const LIFF_ID = '2011940133-JXUDzLnG';

    async function start() {
      try {
        setStatus(
          'GitHub Pagesを読み込みました',
          'LIFFを初期化しています。',
          false
        );

        /**
         * 今回は「まずLINE内で開くか」を切り分ける最小smoke test。
         *
         * 外部ブラウザ用の自動login redirectはまだ入れない。
         * LIFF URLをLINEアプリで開いた時の初期化成功だけを見る。
         */
        await liff.init({
          liffId: LIFF_ID,
        });

        const context = [
          'liff.init: 成功',
          'LINEアプリ内: ' + String(liff.isInClient()),
          'LINEログイン済み: ' + String(liff.isLoggedIn()),
          'LIFF SDK: ' + String(liff.getVersion ? liff.getVersion() : 'unknown'),
          'OS: ' + String(liff.getOS ? liff.getOS() : 'unknown'),
        ].join('\n');

        setStatus(
          'LIFF初期化に成功しました',
          context,
          false
        );
      } catch (error) {
        const code = error && error.code
          ? '[' + error.code + '] '
          : '';

        setStatus(
          '初期化に失敗しました',
          code + (error && error.message ? error.message : String(error)),
          true
        );
      }
    }

    start();
  </script>
</body>
</html>
