<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>TLH 勤怠管理</title>

  <!--
    LINE公式のLIFF SDK。
    このページ自体はGitHub Pagesから通常のtop-level HTTPSページとして配信する。
    GAS HtmlServiceのiframe sandboxを避けるのが今回の重要な設計変更。
  -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: light dark;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: max(24px, env(safe-area-inset-top))
               max(20px, env(safe-area-inset-right))
               max(24px, env(safe-area-inset-bottom))
               max(20px, env(safe-area-inset-left));
      line-height: 1.6;
    }

    main {
      width: min(100%, 560px);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.45rem;
    }

    .subtitle {
      margin: 0;
      opacity: 0.68;
      font-size: 0.9rem;
    }

    .card {
      margin-top: 20px;
      padding: 18px;
      border: 1px solid currentColor;
      border-radius: 14px;
    }

    .status-title {
      font-weight: 700;
    }

    .detail {
      margin-top: 8px;
      opacity: 0.78;
      font-size: 0.92rem;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .steps {
      margin: 14px 0 0;
      padding-left: 1.25rem;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .error {
      opacity: 1;
    }
  </style>
</head>
<body>
  <main>
    <h1>TLH 勤怠管理</h1>
    <p class="subtitle">LINE MINI App 接続テスト — 診断版 D2 (2026-10-09)</p>

    <section class="card" aria-live="polite">
      <div id="status-title" class="status-title">GitHub Pagesを読み込みました</div>
      <div id="status-detail" class="detail">LIFFを初期化しています。</div>

      <ol class="steps">
        <li>GitHub Pages</li>
        <li>LIFF初期化</li>
      </ol>
    </section>
  </main>

  <script>
    /**
     * TLH Workforce / LIFF 診断画面 D2。
     *
     * 目的:
     *  - 古いHTMLのキャッシュと現行コードを画面上の版番号で区別する。
     *  - 「HTML表示」「JavaScript起動」「LIFF SDK検出」「liff.init()完了」
     *    を別々の段階として表示する。
     *  - Promiseが応答しないときも有限時間で診断結果を表示する。
     *
     * 本画面は本人確認・打刻・給与処理をまだ行わない。
     * ID token、URLのquery/hash、LINE userIdをログ/画面へ出さない。
     */

    // LIFF IDは公開識別子。Channel Secretとは別物。
    const LIFF_ID = '2011940133-JXUDzLnG';
    const DIAGNOSTIC_VERSION = 'D2 (2026-10-09)';
    const INIT_TIMEOUT_MS = 15000;

    const titleElement = document.getElementById('status-title');
    const detailElement = document.getElementById('status-detail');
    const startedAt = Date.now();

    /**
     * UI状態の更新はtextContentを使い、外部から得た文字列を
     * HTMLコードとして実行させない。
     */
    function setStatus(title, detail, isError) {
      titleElement.textContent = title;
      detailElement.textContent = detail || '';
      detailElement.className = isError ? 'detail error' : 'detail';
    }

    /**
     * URLはpathnameのみ表示する。
     * LIFFの初期化前URLには認証パラメータが含まれ得るため、
     * location.href / location.search / location.hash は画面やログへ出さない。
     */
    function getSafePagePath() {
      return window.location.origin + window.location.pathname;
    }

    function safeErrorText(error) {
      const code = error && error.code ? String(error.code) : 'UNKNOWN';
      const raw = error && error.message ? String(error.message) : String(error);
      const sanitized = raw.replace(
        /((?:access_token|id_token|liff\.state|code)=)[^\s&]+/gi,
        '$1[hidden]'
      );
      return '[' + code + '] ' + sanitized.slice(0, 300);
    }

    /**
     * Promise.race:
     * 「LIFF初期化の成功/失敗」と「15秒経過」のうち先に
     * 完了した方を採用する。
     *
     * 注意: Promise.raceはLIFF SDKの内部通信を中断する機能ではない。
     * 応答待ちのまま永久に表示が止まることを防ぐ診断用の監視である。
     */
    async function initializeLiffWithTimeout() {
      let timerId;

      const timeout = new Promise(function(_resolve, reject) {
        timerId = window.setTimeout(function() {
          const error = new Error(
            'liff.init() が15秒以内に完了しませんでした。'
          );
          error.code = 'LIFF_INIT_TIMEOUT';
          reject(error);
        }, INIT_TIMEOUT_MS);
      });

      try {
        await Promise.race([
          liff.init({ liffId: LIFF_ID }),
          timeout,
        ]);
      } finally {
        window.clearTimeout(timerId);
      }
    }

    async function start() {
      setStatus(
        '診断 1/3 — JavaScriptが起動しました',
        '診断版: ' + DIAGNOSTIC_VERSION + '\n' +
        'ページ: ' + getSafePagePath() + '\n' +
        'LIFF SDKを検査しています。',
        false
      );

      try {
        if (!window.liff || typeof window.liff.init !== 'function') {
          const error = new Error('LIFF SDKを読み込めませんでした。');
          error.code = 'LIFF_SDK_MISSING';
          throw error;
        }

        setStatus(
          '診断 2/3 — LIFF SDKを検出しました',
          '診断版: ' + DIAGNOSTIC_VERSION + '\n' +
          'ページ: ' + getSafePagePath() + '\n' +
          'liff.init() の完了を最大15秒待っています。',
          false
        );

        await initializeLiffWithTimeout();

        const lines = [
          '診断版: ' + DIAGNOSTIC_VERSION,
          'liff.init: 成功',
          'LINEアプリ内: ' + String(liff.isInClient()),
          'LINEログイン済み: ' + String(liff.isLoggedIn()),
          'LIFF SDK: ' + String(liff.getVersion ? liff.getVersion() : 'unknown'),
          'OS: ' + String(liff.getOS ? liff.getOS() : 'unknown'),
          '初期化所要時間: ' + String(Date.now() - startedAt) + 'ms',
        ];

        setStatus(
          '診断 3/3 — LIFF初期化に成功しました',
          lines.join('\n'),
          false
        );
      } catch (error) {
        setStatus(
          'LIFF診断で停止しました',
          '診断版: ' + DIAGNOSTIC_VERSION + '\n' +
          'ページ: ' + getSafePagePath() + '\n' +
          safeErrorText(error),
          true
        );
      }
    }

    // スクリプトを起動した時点で必ず可視のメッセージが変わる。
    start();
  </script>
</body>
</html>
