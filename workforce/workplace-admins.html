<!-- 現役・店舗内の権限設定。会社雇用や共通Accountの停止ではない。workplace-roles.js/WorkplaceRoleServiceと同期する。 -->
<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>店舗の権限設定 | TLH Workforce</title>
<link rel="stylesheet" href="fonts/ibm-plex-sans-jp.css?v=1"><link rel="stylesheet" href="app.css?v=20261105-company1">
<script defer src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script defer src="tenant-session.js?v=20261105-company1"></script><script defer src="auto-read.js?v=20261103-lifecycle1"></script><script defer src="admin-overview.js?v=20261105-company1"></script><script defer src="admin-access.js?v=20261105-company1"></script><script defer src="workplace-roles.js?v=20261105-company1" data-bootstrap="true"></script>
</head><body class="secondary-page"><header><strong>TLH Workforce</strong><a href="./">打刻画面へ戻る</a></header>
<section id="workplace-banner" class="workplace-context" aria-label="利用する店舗" aria-busy="false">
  <div><span class="workplace-eyebrow">タイムカードの店舗</span><strong id="workplace-name">店舗は本人確認後に表示します</strong><span id="workplace-company"></span></div>
  <div class="workplace-chooser"><label for="workplace-select">店舗を選ぶ</label><select id="workplace-select"><option value="">店舗は未確認です</option></select><button id="workplace-switch" type="button" disabled>店舗を切り替える</button></div>
  <p id="workplace-status" role="status" aria-live="polite">本人確認後に、利用できる店舗を確認します。</p>
  <iframe id="workplace-frame" name="tlhCompanyContextFrame" title="利用できる店舗の確認応答" hidden></iframe>
</section>
<main><h1>この店舗の管理者・打刻権限</h1><p>対象店舗は上に表示されています。他の店舗や会社の権限は変更しません。</p><p>管理者と打刻権限は別です。打刻権限を停止しても、共通アカウント・会社の雇用情報・履歴は残ります。最後の管理者は解除できません。</p>
<button id="role-login" type="button" hidden>LINEログイン</button>
<section id="admin-overview-section" class="admin-overview" hidden><button id="admin-overview-check" type="button" disabled>この店舗の従業員一覧を更新</button><p id="admin-overview-status" role="status">従業員一覧は未確認です。</p><iframe id="admin-overview-frame" name="tlhAdminOverviewFrame" title="この店舗の従業員一覧の応答" hidden></iframe></section>
<fieldset id="role-fields" disabled><label for="role-employee">社員番号（氏名）</label><select id="role-employee"><option value="">従業員一覧を確認してください</option></select><label for="role-kind">変更する権限</label><select id="role-kind"><option value="ADMIN">この店舗の管理者</option><option value="EMPLOYEE">この店舗の打刻</option></select><label for="role-enabled">変更後の状態</label><select id="role-enabled"><option value="true">有効</option><option value="false">停止</option></select><label for="role-reason">変更する理由</label><textarea id="role-reason" rows="3" maxlength="200" required></textarea><button id="role-preview" type="button" disabled>店舗・対象・変更内容を確認する</button></fieldset>
<p id="role-summary" class="footnote" style="white-space:pre-wrap"></p><button id="role-commit" type="button" disabled hidden>確認した店舗の権限を変更する</button><button id="role-cancel" type="button" disabled>確認を取り消す</button><p id="role-status" role="status" aria-live="polite">本人と店舗管理者権限を確認します。</p>
<p id="admin-access-status" class="footnote" role="status">管理者権限は未確認です。</p><iframe id="admin-access-frame" name="tlhAdminAccessFrame" title="店舗管理者権限の確認応答" hidden></iframe><iframe id="role-frame" name="tlhWorkplaceRoleFrame" title="店舗権限設定の応答" hidden></iframe></main></body></html>
